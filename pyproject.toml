[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigcollatz"
version = "0.1.0"
description = "Exact, reproducible experiments on large Collatz trajectories"
requires-python = ">=3.11"

[project.scripts]
bigcollatz = "bigcollatz.cli:main"

[tool.setuptools.packages.find]
include = ["bigcollatz*"]

