[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigcollatz"
version = "0.1.0"
description = "Symbolic algebraic search for Collatz cycles"
requires-python = ">=3.11"

[project.scripts]
collatz-algebra = "collatz_algebra.cli:main"

[tool.setuptools.packages.find]
include = ["collatz_algebra*"]
